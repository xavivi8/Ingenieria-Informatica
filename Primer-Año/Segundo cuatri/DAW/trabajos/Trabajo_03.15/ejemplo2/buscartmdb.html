<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>¿Qué película has visto?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Bootstrap y estilos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css"></link>
    <link rel="stylesheet" href="styles/buscadorStyle.css"/>
    <link rel="stylesheet" href="styles/EstiloGeneral.css"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet"/>

    <!-- Scripts -->
    <script src="tmdb.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="bg-dark text-light d-flex flex-column min-vh-100">
<div class="container d-flex flex-column align-items-center justify-content-center py-5">
    <div class="card p-4 shadow-lg text-light bg-secondary w-100" style="max-width: 900px;">
        <h1 class="fw-bold fs-2 text-center mb-4">¿Qué película has visto?</h1>

        <form onsubmit="return false;" enctype="multipart/form-data">
            <div class="search-wrapper mb-3">
                <div class="search-box d-flex">
                    <i class="fas fa-search search-icon me-2 align-self-center"></i>
                    <input
                            id="busqueda"
                            class="form-control search-input me-2"
                            type="search"
                            placeholder="Busca una película..."
                            required
                    />
                    <button
                            type="button"
                            class="btn btn-primary search-button me-2"
                            onclick="buscarPelicula(document.getElementById('busqueda').value, mostrarResultadosTMDB)"
                    >
                        Buscar en TMDB
                    </button>
                </div>
            </div>

            <!-- Mensajes de error -->
            <div id="messages" class="text-danger mb-3"></div>

            <!-- Resultados -->
            <div
                    id="resultados-tmdb"
                    class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"
            ></div>
            
        </form>
    </div>

</div>
</body>
</html>
