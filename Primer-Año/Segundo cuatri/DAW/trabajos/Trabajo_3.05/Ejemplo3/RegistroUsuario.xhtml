<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <div class="p-4">
        <h3 class="text-center mb-4">Crea tu cuenta</h3>

        <h:form id="formRegistro">

            <h:panelGroup id="exitoWrapper" rendered="#{not empty crtUsuario.mensajeExito and empty facesContext.maximumSeverity}">
                <div style="position: fixed; top: 1rem; right: 1rem; z-index: 1000;">
                    <sl-alert variant="success" open="" duration="4000" closable="">
                        <strong>¡Éxito!</strong> #{crtUsuario.mensajeExito}
                    </sl-alert>
                </div>
            </h:panelGroup>

            <h:panelGroup rendered="#{not empty facesContext.maximumSeverity}">
                <h:messages globalOnly="false"
                            layout="list"
                            styleClass="alert alert-danger"/>
            </h:panelGroup>

            <div class="mb-3">
                <h:outputLabel for="username" value="Usuario:" styleClass="form-label"/>
                <h:inputText id="username"
                             value="#{crtUsuario.usuario}"
                             required="true"
                             requiredMessage="El nombre de usuario es obligatorio"
                             validator="#{crtUsuario.validateUsuarioUnique}"
                             validatorMessage="El usuario ya existe en el sistema"
                             styleClass="form-control"/>
            </div>

            <div class="mb-3">
                <h:outputLabel for="password" value="Contraseña:" styleClass="form-label"/>
                <h:inputSecret id="password"
                               value="#{crtUsuario.contrasena}"
                               required="true"
                               requiredMessage="La contraseña es obligatoria"
                               validatorMessage="La contraseña debe tener al menos 4 caracteres"
                               styleClass="form-control">
                    <f:validateLength minimum="4"/>
                </h:inputSecret>
            </div>

            <div class="d-grid gap-2 mt-3">
                <h:commandButton value="Registrarse"
                                 action="#{crtUsuario.registrar}"
                                 styleClass="btn btn-success">
                    <f:ajax execute="@form"
                            render="formRegistro exitoWrapper" />
                </h:commandButton>
            </div>

        </h:form>
    </div>
</ui:composition>
