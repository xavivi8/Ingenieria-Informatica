<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">
<h:head>
    <title>Ascend - Iniciar Sesión</title>
    <link rel="icon" type="image/png" href="#{resource['imagenes/logo_oscuro_redondo.png']}" />

    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet library="webjars" name="bootstrap/5.3.0/css/bootstrap.min.css"/>
    <h:outputStylesheet library="css" name="formularios.css"/>
    <h:outputStylesheet library="css" name="foto.css"/>
    <h:outputScript library="webjars" name="jquery/3.7.1/jquery.min.js"/>
    <h:outputScript library="js" name="valida.js" pt:defer="true"/>

    <f:metadata>
        <f:viewAction action="#{usuarioCtrl.reestrablceMssg()}" />
    </f:metadata>

</h:head>

<h:body class="bg-primary py-4">

    <header class="container text-center">
        <h:link outcome="/index.xhtml">
            <h:graphicImage library="imagenes" name="logo_blanco.png" alt="Imagen representativa" styleClass="tam-logo-form img-fluid rounded-circle mb-3" />
        </h:link>
    </header>

    <main class="container d-flex justify-content-center">
        <section class="bg-white p-3 rounded shadow-lg text-primary max-width-max w-100">

            <fieldset>
                <legend class="text-center fw-bold fs-2">
                    Accede a tu cuenta
                </legend>

                <!-- Mostrar mensaje si hay error -->
                <h:panelGroup rendered="#{param.error != null}">
                    <div class="d-block mt-2 px-3 py-2 bg-danger text-white fw-bold rounded shadow-sm">
                        <strong>Credenciales incorrectas:</strong>  Por favor, inténtalo de nuevo.
                    </div>
                </h:panelGroup>

                <!-- Formulario j_security_check -->
                <form action="j_security_check" method="post" name="formIniciarSesion">
                    <div class="mb-3">
                        <label for="j_username" class="form-label fw-bold">Correo Electrónico:</label>
                        <input type="text" id="j_username" name="j_username"
                               class="form-control border-primary text-primary"
                               placeholder="Ingrese su email" />
                        <span id="errorLoginEmail" class="d-none d-block mt-2 px-3 py-2 bg-danger text-white fw-bold rounded shadow-sm"/>
                    </div>

                    <div class="mb-3">
                        <label for="j_password" class="form-label fw-bold">Contraseña:</label>
                        <input type="password" id="j_password" name="j_password"
                               class="form-control border-primary text-primary"
                               placeholder="Ingrese su contraseña" />
                        <span id="errorLoginPassword" class="d-none d-block mt-2 px-3 py-2 bg-danger text-white fw-bold rounded shadow-sm"/>
                    </div>

                    <div class="text-center mb-3">
                        <h:link outcome="/usuario/recuperar_contrasenia.xhtml"
                                styleClass="text-primary text-decoration-none fw-bold">
                            ¿Has olvidado la contraseña?
                        </h:link>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Iniciar Sesión</button>
                    </div>
                </form>
                <div class="d-grid mb-3">
                    <h:form>
                        <h:commandButton value="Iniciar sesión con Google"
                                         action="#{usuarioCtrl.redirigirAOIDC}"
                                         styleClass="btn btn-danger w-100 fw-bold" />
                    </h:form>
                </div>
                <!-- Separador -->
                <div class="d-flex align-items-center my-3">
                    <hr class="flex-grow-1 bg-primary" />
                    <span class="mx-2 fw-bold text-primary">o</span>
                    <hr class="flex-grow-1 bg-primary" />
                </div>

                <!-- Botón de crear cuenta -->
                <div class="d-grid">
                    <h:link outcome="/usuario/crear.xhtml" styleClass="btn btn-outline-success w-100 fw-bold">
                        Crear cuenta nueva
                    </h:link>
                </div>
            </fieldset>
        </section>
    </main>
</h:body>
</html>
