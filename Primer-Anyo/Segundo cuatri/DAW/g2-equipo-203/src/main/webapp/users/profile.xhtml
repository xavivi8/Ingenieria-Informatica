<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:pt="jakarta.faces.passthrough">

<ui:composition template="/WEB-INF/templates/MenuTemplate.xhtml">
    <ui:define name="plantilla">

        <div class="container mt-5">
            <h2 class="mb-4">Perfil del usuario</h2>

            <div class="card shadow-sm p-4">
                <div class="row">
                    <!-- Foto y selección de imagen -->
                    <div class="col-md-4 text-center">
                        <!-- Imagen actual -->
                        <h:graphicImage value="#{resource['img/' += loginController.usuarioActual.photo != null ? loginController.usuarioActual.photo : 'default.png']}"
                                        class="img-fluid rounded-circle mb-3"
                                        style="width: 150px; height: 150px; object-fit: cover;" />
                        <h4 class="mt-2 fw-bold">#{loginController.usuarioActual.name} #{loginController.usuarioActual.surname}</h4>
                        <p class="text-muted">Rol: #{loginController.usuarioActual.role}</p>

                        <!-- Formulario para cambiar imagen -->
                        <h:form>
                            <h:panelGroup layout="block" styleClass="mt-3">
                                <h:outputLabel value="Cambiar imagen:" styleClass="form-label"/>

                                <h:selectOneMenu value="#{loginController.usuarioActual.photo}" styleClass="form-select">
                                    <f:selectItem itemLabel="Selecciona una imagen" itemValue="" />
                                    <f:selectItem itemLabel="Poro" itemValue="poro.jpg"/>
                                    <f:selectItem itemLabel="Avatar 1" itemValue="avatar1.png"/>
                                    <f:selectItem itemLabel="Avatar 2" itemValue="avatar2.png"/>
                                    <!-- Añade más imágenes según tengas -->
                                </h:selectOneMenu>

                                <h:commandButton value="Guardar"
                                                 action="#{userCtrl.actualizarFoto(loginController.usuarioActual)}"
                                                 styleClass="btn btn-primary mt-2"/>
                            </h:panelGroup>
                        </h:form>
                    </div>

                    <!-- Datos del usuario -->
                    <div class="col-md-8">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item"><strong>Email:</strong> #{loginController.usuarioActual.email}</li>
                            <li class="list-group-item"><strong>DNI:</strong> #{loginController.usuarioActual.dni}</li>
                            <li class="list-group-item"><strong>Teléfono:</strong> #{loginController.usuarioActual.phone}</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

    </ui:define>
</ui:composition>
</html>
