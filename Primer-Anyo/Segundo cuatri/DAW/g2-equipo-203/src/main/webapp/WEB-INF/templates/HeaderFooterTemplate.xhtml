<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <h:outputStylesheet library="css" name="commun.css"/>
    <ui:insert name="HFTextraHead"/>
    <link rel="shortcut icon" type="image/x-icon" href="#{resource['img/logo.ico']}" />
</h:head>
<h:body>
    <!-- CABECERA -->
    <header class="bg-primary text-white position-fixed shadow w-100 p-3 d-flex align-items-center justify-content-between">
        <!-- Zona izquierda vacía -->
        <div style="width: 70px;"></div>

        <!-- Centro con logo y texto -->
        <div class="d-flex align-items-center justify-content-center">
            <h:graphicImage library="img" name="logo.jpeg" styleClass="rounded-circle border" style="width: 40px; height: 40px; object-fit: cover;" />
            <h2 class="fw-bold m-0 ms-3">CRM</h2>
        </div>

        <!-- Botón logout -->
        <div>
            <h:panelGroup rendered="#{loginController.loggedIn}">
                <div class="dropdown">
                    <!-- Imagen como botón para desplegar -->
                    <a class="btn dropdown-toggle p-0 border-0 bg-transparent" href="#" role="button"
                       id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                        <h:graphicImage library="img" name="poro.jpg" styleClass="rounded-circle border" style="width: 40px; height: 40px; object-fit: cover;" />
                    </a>

                    <!-- Menú desplegable -->
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton">
                        <li>
                            <h:link outcome="/users/profile.xhtml" styleClass="dropdown-item">
                                Perfil
                            </h:link>
                        </li>
                        <li>
                            <h:form>
                                <h:commandLink action="#{loginController.logout}" styleClass="dropdown-item">
                                    Cerrar sesión
                                </h:commandLink>
                            </h:form>
                        </li>
                    </ul>
                </div>
            </h:panelGroup>

        </div>

    </header>


    <ui:insert name="HFTcontenido"/>
    <!-- FOOTER -->
    <footer class="bg-dark text-white mt-4 py-3 w-100">
        <div class="container d-flex justify-content-between">
            <a href="https://github.com/DAWUJA-2025/g2-equipo-203" class="text-white" target="_blank">Repositorio en GitHub</a>
            <div>
                <a href="https://github.com/xavivi8" class="text-white mx-2" target="_blank">Fco. Javier Martín-Lunas Escobar</a>
                <a href="https://github.com/pjcp0005" class="text-white mx-2" target="_blank">Pedro Jesús Cros Pérez</a>
                <a href="https://github.com/jpt00012" class="text-white mx-2" target="_blank">José Pedrajas De La Torre</a>
            </div>
        </div>
    </footer>
</h:body>

</html>
