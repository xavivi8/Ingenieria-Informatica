<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<ui:composition template="/WEB-INF/templates/HeaderFooterTemplate.xhtml">
    <ui:define name="HFTcontenido">
        <h:head>
            <title>Login St 2</title>
        </h:head>
        <h:body>
            <!-- Contenedor de Bootstrap para centrar el contenido -->
            <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
                <h:form>
                    <p:panel header="Inicio de Sesión - Paso 2" styleClass="shadow-lg p-3 mb-5 bg-white rounded">
                        <p:messages/>
                        <div class="form-group mb-3">
                            <h:outputLabel for="email" value="Correo electrónico:"/>
                            <p:inputText id="email" value="#{loginController.email}" disabled="true"
                                         styleClass="form-control"/>
                        </div>

                        <div class="form-group mb-3">
                            <h:outputLabel for="password" value="Contraseña:"/>
                            <p:password id="password" value="#{loginController.password}" required="true"
                                        requiredMessage="La contraseña es obligatoria"
                                        styleClass="form-control"/>
                        </div>
                        <!-- Botón con margen inferior -->
                        <div class="form-group mb-3">
                            <p:commandButton value="Iniciar sesión"
                                             action="#{loginController.login()}"
                                             ajax="false"
                                             styleClass="btn btn-primary w-100"/>
                        </div>
                    </p:panel>
                </h:form>
            </div>
        </h:body>
    </ui:define>
</ui:composition>
</html>
