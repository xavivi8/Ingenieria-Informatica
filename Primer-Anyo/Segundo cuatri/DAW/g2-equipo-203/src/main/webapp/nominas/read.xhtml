<ui:composition
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:ui="jakarta.faces.facelets"
        template="/WEB-INF/templates/MenuTemplate.xhtml"
        xmlns:crm="jakarta.faces.composite/crmcomp">

    <ui:define name="plantilla">


        <ui:define name="metadata">
            <f:metadata>
                <f:viewParam name="id" value="#{payslipCtrl.payslip.id}"/>
                <f:viewAction action="#{payslipCtrl.recuperaPayslip()}" />
            </f:metadata>
        </ui:define>


        <h1 class="text-center mb-4">Visualiza Nóminas</h1>

        <crm:receipt value="#{payslipCtrl.payslip}" />


        <div class="text-center">
            <h:button styleClass="btn btn-primary btn-sm" value="Inicio" outcome="home"/>
        </div>

    </ui:define>
</ui:composition>
