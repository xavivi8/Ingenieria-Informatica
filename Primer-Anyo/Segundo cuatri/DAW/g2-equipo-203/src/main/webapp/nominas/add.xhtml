<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
<ui:composition template="/WEB-INF/templates/MenuTemplate.xhtml">
    <ui:define name="plantilla">
        <main class="container mt-5 pt-3">
            <h:form>
                <h2 class="mb-4">Formulario Nóminas</h2>
                <div class="mb-3">
                    <h:outputLabel for="userID" value="Seleccionar Usuario:" />
                    <p:selectOneMenu id="userID"
                                     value="#{payslipCtrl.payslip.userID}"
                                     required="true" requiredMessage="Debe seleccionar un usuario"
                                     styleClass="form-control">
                        <f:selectItem itemLabel="Seleccione un usuario" itemValue="" noSelectionOption="true"/>
                        <f:selectItems value="#{userCtrl.users}" var="user" itemLabel="#{user.dni}" itemValue="#{user.id}" />
                    </p:selectOneMenu>
                    <h:message for="userID" styleClass="text-danger" />
                </div>
                <div class="col-md-6">
                    <h:outputLabel for="date" value="Fecha"/>
                    <p:datePicker id="date"
                                  value="#{payslipCtrl.payslip.date}"
                                  pattern="yyyy-MM-dd"
                                  showIcon="true"
                                  required="true"
                                  styleClass="form-control"/>
                </div>
                <div class="mb-3">
                    <h:outputLabel for="base_salary" value="base_salary"/>
                    <h:inputText id="base_salary" value="#{payslipCtrl.payslip.baseSalary}" required="true"
                                 styleClass="form-control">
                        <f:convertNumber type="number"/>
                    </h:inputText>
                </div>
                <div class="mb-3">
                    <h:outputLabel for="status" value="status"/>
                    <h:selectOneMenu id="status" value="#{payslipCtrl.payslip.status}" styleClass="form-select">
                        <f:selectItem itemLabel="-- Selecciona un estatus --" itemValue="#{null}"
                                      noSelectionOption="true"/>
                        <f:selectItems value="#{payslipCtrl.appConfig.availableStatus}" var="r" itemValue="#{r}"
                                       itemLabel="#{r}"/>
                    </h:selectOneMenu>
                </div>


                <h:commandButton value="Alta"
                                 action="#{payslipCtrl.crea()}"
                                 styleClass="btn btn-success"
                />
            </h:form>
        </main>
    </ui:define>
</ui:composition>
</html>
