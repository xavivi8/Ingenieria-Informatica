<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      lang="es">
<h:head>
    <title>Gestor de Proyectos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</h:head>
<h:body class="bg-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow px-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">GestorPro</a>

            <h:form styleClass="d-flex">
                <h:commandButton value="Iniciar sesión"
                                 action="#{authBean.login}"
                                 styleClass="btn btn-light" />
            </h:form>
        </div>
    </nav>


    <!-- Contenido principal -->
    <div class="container text-center mt-5">
        <h1 class="display-3 fw-semibold mb-4">Bienvenido a GestorPro</h1>
        <p class="lead text-secondary">Gestiona tareas, proyectos y equipos con agilidad e inteligencia.</p>

        <!-- Tarjeta de estadísticas -->
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title">📊 Actividad en tiempo real</h5>
                        <ul class="list-group list-group-flush mt-3">
                            <li class="list-group-item">✔ 124 proyectos activos</li>
                            <li class="list-group-item">👥 32 usuarios conectados</li>
                            <li class="list-group-item">🕒 Última actualización: hace 5 minutos</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

</h:body>
</html>
