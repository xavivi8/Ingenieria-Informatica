<ui:composition template="/WEB-INF/templates/layoutGeneral.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:define name="titulo">
        Iniciar Sesión
    </ui:define>

    <ui:define name="header">
        <h1 class="text-success text-uppercase">INICIO DE SESIÓN</h1>
    </ui:define>

    <ui:define name="contenido">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css" />
        <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>

        <section class="py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-4">
                        <div class="card p-4 shadow-lg">
                            <h3 class="text-center mb-4">Accede a tu cuenta</h3>

                            <h:panelGroup rendered="#{param.error != null}">
                                <p class="alert alert-danger">Error de autenticación</p>
                            </h:panelGroup>

                            <form action="j_security_check" method="post">
                                <div class="form-group mb-3">
                                    <label for="j_username" class="form-label">Usuario:</label>
                                    <input type="text" id="j_username" name="j_username"
                                           class="form-control" />
                                </div>

                                <div class="form-group mb-3">
                                    <label for="j_password" class="form-label">Contraseña:</label>
                                    <input type="password" id="j_password" name="j_password"
                                           class="form-control" />
                                </div>

                                <div class="text-center">
                                    <button type="submit"
                                            class="btn btn-success btn-block mt-3">
                                        Iniciar sesión
                                    </button>
                                </div>

                                <div class="text-center">
                                    <button type="button"
                                            id="abrir-modal"
                                            class="btn btn-secondary btn-block mt-3">
                                        Registrarse
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <sl-dialog
                id="modal-registro"
                style="
      --width: 1200px;
      --max-width: 400vw;
      --max-height: 80vh;
      --padding: 1.25rem;
    ">
            <div style="display: flex; justify-content: center;">
                <ui:include src="RegistroUsuario.xhtml"/>
            </div>
            <sl-button slot="footer"
                       variant="default"
                       id="cerrar-modal">
                Cerrar
            </sl-button>
        </sl-dialog>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const modal = document.getElementById('modal-registro');
                const abrir = document.getElementById('abrir-modal');
                const cerrar = document.getElementById('cerrar-modal');

                abrir.addEventListener('click',  () => modal.show());
                cerrar.addEventListener('click', () => modal.hide());
            });
        </script>
    </ui:define>
</ui:composition>
